<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Baby Shower Jacobo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
  --oliva:#7c8a5b;
  --beige:#f6f1e7;
  --cafe:#6b513e;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Baloo 2', cursive;
  background:linear-gradient(#fff,var(--beige));
  color:var(--cafe);
  overflow-x:hidden;
}

/* ================= SOBRE ================= */
#cover{
  position:fixed;
  inset:0;
  background:radial-gradient(var(--beige),var(--oliva));
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:100;
  transition:transform 2s ease-in-out;
}
#cover.open{transform:translateY(-120%)}

.envelope{
  width:320px;height:220px;
  background:#e3d4bb;
  border-radius:18px;
  box-shadow:0 15px 25px rgba(0,0,0,.25);
  position:relative;
  cursor:pointer;
  animation:pulse 2s infinite;
}
.envelope::before{
  content:"";
  position:absolute;
  inset:0;
  clip-path:polygon(0 0,100% 0,50% 60%);
  background:#cfbb9c;
}
@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.05)}
  100%{transform:scale(1)}
}

/* ================= SECCIONES ================= */
section{
  padding:100px 20px;
  text-align:center;
  position:relative;
  overflow:hidden;
}

.title{
  font-family:'Pacifico',cursive;
  font-size:3rem;
  color:var(--oliva);
}

.story{
  font-size:1.6rem;
  max-width:820px;
  margin:30px auto;
  line-height:1.6;
}

/* ================= OSOS FONDO ================= */
.bg-bear{
  position:absolute;
  width:160px;
  opacity:.95;
  animation:floatBear 6s ease-in-out infinite;
  z-index:-1;
}

.bg-bear.left{left:-30px;top:100px}
.bg-bear.right{right:-30px;bottom:100px}

@keyframes floatBear{
  0%{transform:translateY(0)}
  50%{transform:translateY(-30px)}
  100%{transform:translateY(0)}
}

/* ================= BRILLO ================= */
.sparkles::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.6),transparent 40%),
    radial-gradient(circle at 80% 60%,rgba(255,255,255,.4),transparent 45%);
  animation:sparkle 6s infinite alternate;
  pointer-events:none;
}
@keyframes sparkle{
  from{opacity:.4}
  to{opacity:1}
}

/* ================= COUNTDOWN ================= */
#countdown{
  background:white;
  display:inline-block;
  padding:18px 30px;
  border-radius:25px;
  font-size:1.2rem;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
}

/* ================= GALERIA ================= */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:25px;
  max-width:1000px;
  margin:auto;
}

.gallery img{
  width:100%;
  border-radius:30px;
  border:10px solid #f6f1e7;
  box-shadow:
    0 0 0 6px #e3d7c6,
    0 18px 35px rgba(0,0,0,.25);
}

/* ================= BOTONES ================= */
button{
  background:var(--oliva);
  border:none;
  color:white;
  padding:18px 30px;
  border-radius:40px;
  font-size:1.1rem;
  cursor:pointer;
  transition:.3s;
}
button:hover{
  background:var(--cafe);
  transform:scale(1.08);
}

/* ================= CONFETTI ================= */
.confetti{
  position:fixed;
  top:-5vh;
  font-size:26px;
  animation:fall linear forwards;
}
@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg)}
}

/* ================= FINAL ================= */
.final{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.wave{
  width:220px;
  animation:wave 2s infinite;
}
@keyframes wave{
  0%,100%{transform:rotate(0deg)}
  50%{transform:rotate(8deg)}
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="regalo de Dios.mp3" type="audio/mpeg">
</audio>

<!-- SOBRE -->
<div id="cover">
  <div class="envelope" onclick="openInvite()"></div>
  <p style="margin-top:25px;font-size:1.4rem">🧸 Toca para abrir 🧸</p>
</div>

<!-- PORTADA -->
<section id="invite" class="sparkles" style="opacity:0;transition:opacity 2s">
  <img src="oso1.jpg" class="bg-bear left">
  <img src="oso2.jpg" class="bg-bear right">

  <h1 class="title">Baby Shower Jacobo</h1>

  <p class="story">
    “Mis papás todavía no saben de ser papás,<br>
    pero sí son expertos en fiestas y celebraciones,<br>
    así que por favor no faltes a mi Baby Shower 🧸”
  </p>

  <div id="countdown"></div>
</section>

<!-- GALERIA -->
<section>
  <h2>Nuestros momentos 💚</h2>
  <div class="gallery">
    <img src="IMG_0969.JPG">
    <img src="IMG_0971.JPG">
    <img src="IMG_0974.JPG">
    <img src="IMG_0977.JPG">
  </div>
</section>

<!-- FINAL -->
<section class="final">
  <h1 class="title">¡Te esperamos!</h1>
  <img src="oso_salu.jpg" class="wave">
</section>

<script>
function openInvite(){
  document.getElementById("cover").classList.add("open");
  document.getElementById("invite").style.opacity=1;

  const audio=document.getElementById("music");
  audio.volume=0.8;
  audio.play();

  confetti();
}

/* COUNTDOWN */
const eventDate=new Date("June 7, 2026 15:00:00").getTime();
setInterval(()=>{
  const diff=eventDate-new Date().getTime();
  const d=Math.floor(diff/(1000*60*60*24));
  const h=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
  document.getElementById("countdown").innerText=
    `⏳ Faltan ${d} días ${h} horas`;
},1000);

/* CONFETTI */
function confetti(){
  const icons=["🧸","✨","⭐","✉️"];
  for(let i=0;i<80;i++){
    const el=document.createElement("div");
    el.className="confetti";
    el.innerText=icons[Math.random()*icons.length|0];
    el.style.left=Math.random()*100+"vw";
    el.style.animationDuration=(Math.random()*3+4)+"s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),8000);
  }
}
</script>

</body>
</html>
